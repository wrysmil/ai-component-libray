name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies (lockfile)
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Manifest consistency
        run: npm run generate:manifest && git diff --exit-code src/manifest/manifest.json

      - name: Build library and site
        run: npm run build

      - name: Search benchmark (p95 < 300ms)
        run: npm run bench:search
